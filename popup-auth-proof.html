<!doctype html>
<meta charset="utf-8">
<title>PR/PO popup authentication proof</title>
<button id="open">Open popup and verify sign-in</button>
<p id="status">Ready.</p>
<script>
document.getElementById('open').addEventListener('click', function(){
  const status = document.getElementById('status');
  const child = window.open('./', 'prpoPopupProof' + Date.now(), 'popup=yes,width=1200,height=800');
  if(!child){ status.textContent = 'FAIL: Chrome blocked the popup.'; return; }
  status.textContent = 'Popup opened.';
  const started = Date.now();
  const poll = setInterval(function(){
    if(child.closed){
      clearInterval(poll);
      status.textContent = 'FAIL: popup closed before verification.';
      return;
    }
    if(Date.now() - started > 60000){
      clearInterval(poll);
      status.textContent = 'FAIL: timed out waiting for the signed-in dashboard.';
      return;
    }
    try{
      const overlay = child.document.getElementById('loginOverlay');
      if(!overlay) return;
      if(overlay.classList.contains('hidden')){
        clearInterval(poll);
        status.textContent = 'PASS: popup returned signed in and rendered the dashboard.';
        return;
      }
      const signIn = child.document.querySelector('.signin-btn');
      if(signIn && !child.__popupProofSignInStarted){
        child.__popupProofSignInStarted = true;
        signIn.click();
        status.textContent = 'Redirect sign-in started in the popup.';
      }
    }catch(e){
      status.textContent = 'Microsoft sign-in is in progress.';
    }
  }, 250);
});
</script>
