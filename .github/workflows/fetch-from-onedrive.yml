# Cloud auto-update: pulls Abdul's latest PR/PO files from OneDrive (via Microsoft
# Graph) and refreshes the dashboard - runs in GitHub's cloud, so it works even when
# CK's laptop is off. The Power Automate flow just needs to keep saving the email
# attachments into the OneDrive "Email-Drops" folder.
#
# HOW IT IS TRIGGERED (Sep 2026): the Azure Function `prpo-fetch-trigger` in
# Strive-Services-Group/pr-po-proxy fires this workflow via workflow_dispatch every
# 5 minutes 09:00-11:55 Dubai until today's pr.xlsx is committed. GitHub's own cron
# below is only a late-day backstop - it has been observed firing 4-5 hours late and
# collapsing the 5-minute window into a single run, so do NOT rely on it for the
# 10:00 AM email. The workflow must stay ENABLED (a disabled workflow rejects
# workflow_dispatch) - the old self-disable / re-arm pair has been removed.
name: Fetch PR/PO from OneDrive
on:
  schedule:
    - cron: "0 9,11 * * 1-5"   # backstop only: 13:00 + 15:00 Dubai (UTC+4), weekdays
  workflow_dispatch:           # fired by pr-po-proxy /api/prpo-fetch, or on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: fetch-onedrive
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl
      - name: Pull latest exports from OneDrive
        env:
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          ONEDRIVE_USER: ${{ secrets.ONEDRIVE_USER }}
          ONEDRIVE_FOLDER: ${{ secrets.ONEDRIVE_FOLDER }}
        run: python fetch_from_onedrive.py
      - name: Commit and push any changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pr.xlsx po.xlsx pr_steps.json
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Cloud data refresh from OneDrive"
            git push
            echo "New data processed."
          fi
