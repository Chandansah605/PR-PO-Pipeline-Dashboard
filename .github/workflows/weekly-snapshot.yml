# Week-end pipeline snapshot: every Sunday night (Dubai) capture the live PR/PO
# sub-bucket state into weekly_snapshots.json so the dashboard's "Sub-bucket
# Weekly Comparison" section can show Last Week / Last Two Week vs Current Week.
name: Weekly sub-bucket snapshot
on:
  schedule:
    - cron: "15 20 * * 0"   # Sunday 20:15 UTC = Monday 00:15 Dubai (captures Sunday week-end)
  workflow_dispatch:
    inputs:
      asof:
        description: "Week-end date YYYY-MM-DD (Sunday). Blank = most recent Sunday (Dubai)."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: weekly-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Generate snapshot
        run: |
          ASOF="${{ github.event.inputs.asof }}"
          if [ -z "$ASOF" ]; then
            # most recent Sunday, Dubai time (when run Monday 00:15 Dubai → yesterday)
            ASOF=$(TZ=Asia/Dubai date -d "last sunday" +%F)
            [ "$(TZ=Asia/Dubai date +%u)" = "7" ] && ASOF=$(TZ=Asia/Dubai date +%F)
          fi
          echo "Snapshot as of $ASOF"
          python3 gen_weekly_snapshot.py --pr pr.xlsx --po po.xlsx \
            --asof "$ASOF" --out weekly_snapshots.json --source "action:${GITHUB_SHA::7}"
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weekly_snapshots.json
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "Weekly sub-bucket snapshot"
          git push
