name: Publish legacy email workbooks

on:
  schedule:
    # Eight weekday attempts. The last starts at 05:45 UTC, before Chandan's 06:00 timer.
    - cron: "*/15 4-5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-legacy-email-workbooks
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-legacy-email-workbooks.txt
      - name: Install workbook writer
        run: python -m pip install -r scripts/requirements-legacy-email-workbooks.txt
      - name: Generate one-way legacy email outputs
        run: python scripts/generate_legacy_email_workbooks.py
      - name: Commit only changed workbook content
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- pr.xlsx po.xlsx .legacy-email-workbook-content.json; then
            echo "Live revision already published; no commit required."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pr.xlsx po.xlsx .legacy-email-workbook-content.json
          git commit -m "chore: refresh legacy email workbooks"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN pushes do not reliably start another workflow. Deploy the
      # changed checkout directly so Pages is updated before the 06:00 sender.
      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
